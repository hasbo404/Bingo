<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Recharge Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            color: #00ff88;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #1b1b1b;
            padding: 10px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }
        nav a:hover {
            color: #00ff88;
        }
        .banner {
            background: url('banner-image.jpg') no-repeat center center/cover;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
        }
        .banner h1 {
            font-size: 48px;
            text-shadow: 2px 2px 5px #000;
        }
        .container {
            padding: 20px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .product {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            width: 200px;
        }
        .product img {
            max-width: 100%;
            border-radius: 8px;
        }
        .product h3 {
            font-size: 18px;
            margin: 10px 0;
        }
        .product button {
            background-color: #00ff88;
            border: none;
            padding: 10px;
            border-radius: 5px;
            color: #000;
            cursor: pointer;
        }
        .product button:hover {
            background-color: #00cc66;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #1f1f1f;
            color: #fff;
            margin-top: 20px;
            position: relative;
        }
        .whatsapp-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <header>
        <h1>Game Recharge Store</h1>
    </header>
    <nav>
        <a href="#home">Home</a>
        <a href="#games">Games</a>
        <a href="#gift-cards">Gift Cards</a>
        <a href="#contact">Contact</a>
    </nav>
    <div class="banner">
        <h1>Top Up Your Favorite Games Now!</h1>
    </div>
    <div class="container">
        <h2>Featured Products</h2>
        <div class="products">
            <div class="product">
                <img src="https://i.imgur.com/kbSsfjH.png" alt="Game 1">
                <h3>100+10</h3>
                <button>Buy Now</button>
            </div>
            <div class="product">
                <img src="https://i.imgur.com/kbSsfjH.png" alt="Game 2">
                <h3>200+20</h3>
                <button>Buy Now</button>
            </div>
            <div class="product">
                <img src="https://i.imgur.com/kbSsfjH.png" alt="Game 3">
                <h3>1000+10</h3>
                <button>Buy Now</button>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2025 Game Recharge Store. All Rights Reserved.</p>
    </footer>
    <a href="https://wa.me/1234567890" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="whatsapp-icon">
    </a>
</body>
</html>
